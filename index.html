---
layout: default
body_class: listing
---
<main>
    <figure class="hero">
        <img src="{{ '/assets/img/monge-escriba.jpg' | relative_url }}" width="960" height="806"
             alt="Iluminura medieval em tons de cinza: um escriba de manto e capuz escreve num pergaminho apoiado numa estante inclinada, cercado de livros, rolos e tinteiros.">
        <figcaption>Jean Miélot em seu scriptorium, por Jean Le Tavernier, c. 1456</figcaption>
    </figure>

    <h1>Blog</h1>
    {% for post in site.posts %}
    <div class="post">
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        {% include date.html date=post.date %}
    </div>
    {% endfor %}
</main>
