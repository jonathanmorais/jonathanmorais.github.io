---
layout: default
body_class: listing
---
<main>
    <img class="hero" src="{{ '/assets/img/monge-escriba.jpg' | relative_url }}" width="960" height="806"
         alt="Iluminura medieval de um escriba escrevendo num pergaminho"
         title="Jean Miélot em seu scriptorium, por Jean Le Tavernier, c. 1456">

    <h1>Blog</h1>
    {% for post in site.posts %}
    <div class="post">
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        {% include date.html date=post.date %}
    </div>
    {% endfor %}
</main>
